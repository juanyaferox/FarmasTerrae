# Local development profile: in-memory H2 database seeded from data.sql.
# H2 is only on the classpath with the `dev` Maven profile, which also activates this profile:
#   ./mvnw -Pdev spring-boot:run
# The data.sql demo accounts use the password `123`: never expose this profile outside your machine.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# H2 console at /h2-console (SecurityConfig restricts it to ADMIN users)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.devtools.livereload.enabled=true

# Development-only placeholders. Override them (e.g. real SMTP or local MinIO keys plus
# aws.s3.endpoint=http://localhost:9000) in the gitignored application-secrets.properties,
# which is imported here so it takes precedence over the values below.
spring.config.import=optional:classpath:application-secrets.properties
app.security=dev-only-remember-me-key-32-characters-minimum
app.base-url=http://localhost:8080
spring.mail.username=dev@farmasterrae.local
spring.mail.password=dev-mail-password
aws.s3.static-credentials=true
aws.accessKey=dev-access-key
aws.secretKey=dev-secret-key
