# Local Docker stack (docker-compose.help.yml): MySQL + MinIO over plain HTTP on localhost.
# Seeds the demo dataset (Liquibase `dev` context, password `123`): never expose it publicly.
app.security=${SECRET_KEY}
app.base-url=${APP_BASE_URL:https://localhost}

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:farmasterrae}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.jpa.show-sql=false

# The local stack is served over plain HTTP, where browsers drop Secure cookies
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Liquibase runs after Hibernate (LiquibaseRunnerConfig); `dev` adds the demo dataset
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/data-only-changelog.yaml
spring.liquibase.contexts=dev
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration

spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

# SMTP credentials (optional locally)
spring.mail.username=${EMAIL:}
spring.mail.password=${PASSWORD:}

# MinIO: the app talks to the internal endpoint; presigned URLs use the browser-facing one
aws.s3.static-credentials=true
aws.accessKey=${MINIO_ROOT_USER:minioadmin}
aws.secretKey=${MINIO_ROOT_PASSWORD:minioadmin}
aws.region=us-east-1
aws.s3.endpoint=http://minio:9000
aws.s3.public-endpoint=${AWS_PUBLIC_ENDPOINT:http://localhost:9000}
aws.s3.bucket-name=farmasterrae
