# Production profile (docker-compose.yml): MySQL + AWS S3 behind the Nginx TLS proxy.
# Every secret comes from the environment; see docs/env-vars-for-prod.md.
app.security=${SECRET_KEY}
app.base-url=${APP_BASE_URL:https://localhost}

# MySQL (no root or empty-password fallbacks; TLS mode is configurable)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:farmasterrae}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:PREFERRED}&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate still owns the schema (the Liquibase changelog is data-only), so the default `update`
# lets a fresh database boot. Set HIBERNATE_DDL_AUTO=validate once the schema exists.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.jpa.show-sql=false

# Session cookies are HTTPS-only
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Trust X-Forwarded-For/-Proto only from Nginx on the private Docker network (Tomcat RemoteIpValve)
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.(?:1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|127\\.0\\.0\\.1

# Liquibase runs after Hibernate (LiquibaseRunnerConfig). The `prod` context only seeds the
# ADMIN/USER profiles; the demo dataset requires the `dev` context and never runs here.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/data-only-changelog.yaml
spring.liquibase.contexts=prod
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration

spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

# SMTP credentials (password recovery)
spring.mail.username=${EMAIL:}
spring.mail.password=${PASSWORD:}

# AWS S3: credentials come from the default provider chain (e.g. the EC2/ECS IAM role)
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_BUCKET:farmasterrae}
aws.s3.static-credentials=false
