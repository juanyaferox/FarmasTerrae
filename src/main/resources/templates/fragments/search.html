<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- FarmasTerrae — Fragmento de buscador reutilizable -->
<div th:fragment="search (actionUrl)"
     th:with="searchInputId=${'ft-search' + #strings.replace(actionUrl, '/', '-')}">
    <form th:action="@{${actionUrl}}" method="get" class="ft-search" role="search">
        <!-- Campos ocultos para preservar parámetros existentes -->
        <input th:each="paramEntry : ${param}"
               th:unless="${paramEntry.key == 'search' or paramEntry.key == 'page'}"
               type="hidden"
               th:name="${paramEntry.key}"
               th:value="${paramEntry.value[0]}">

        <label th:for="${searchInputId}" class="ft-sr-only">Buscar productos</label>
        <svg class="ft-search__icon" width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input th:id="${searchInputId}" type="text" name="search" class="ft-search__input"
               placeholder="Buscar productos..."
               th:value="${param.search != null ? param.search[0] : ''}">
        <button type="submit" class="ft-btn ft-btn--sm ft-btn--mint ft-search__button">Buscar</button>
    </form>
</div>
</html>
