<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="infoUserSection(userView)" class="ft-panel">
    <div class="ft-panel__head">
        <div>
            <span class="ft-eyebrow"><span class="ft-dot" aria-hidden="true"></span>Mi información</span>
            <h1 id="info-title" class="ft-panel__title">Actualizar Información</h1>
            <p class="ud-sub">Actualiza tus datos de contacto y dirección de envío. Los campos marcados con <span class="ft-required" aria-hidden="true">*</span> son obligatorios.</p>
        </div>
    </div>

    <form th:action="@{/user/dashboard/info-user}" th:object="${userView}" method="post"
          class="ft-form-stack" aria-labelledby="info-title">
        <div class="ft-form-grid">
            <div class="ft-field">
                <label for="username" class="ft-label">Nombre de usuario <span class="ft-required" aria-hidden="true">*</span></label>
                <input type="text" id="username" th:field="*{username}" class="ft-input"
                       autocomplete="username" required aria-describedby="username-hint">
                <span id="username-hint" class="ft-hint">Lo usas para iniciar sesión.</span>
            </div>
            <div class="ft-field">
                <label for="fullName" class="ft-label">Nombre completo</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="ft-input"
                       autocomplete="name">
            </div>
            <div class="ft-field">
                <label for="email" class="ft-label">Correo electrónico <span class="ft-required" aria-hidden="true">*</span></label>
                <input type="email" id="email" th:field="*{email}" class="ft-input"
                       autocomplete="email" required>
            </div>
            <div class="ft-field">
                <label for="phone" class="ft-label">Teléfono</label>
                <input type="tel" id="phone" th:field="*{phone}" class="ft-input ft-tabular"
                       autocomplete="tel" inputmode="tel">
            </div>
            <div class="ft-field ft-form-grid__full">
                <label for="address" class="ft-label">Dirección de envío</label>
                <input type="text" id="address" th:field="*{address}" class="ft-input"
                       autocomplete="street-address" aria-describedby="address-hint">
                <span id="address-hint" class="ft-hint">Calle, número, piso, código postal y localidad.</span>
            </div>
        </div>

        <div class="ft-form-actions">
            <button type="submit" class="ft-btn ft-btn--mint">Guardar cambios</button>
            <a th:href="@{/auth/changePassword}" class="ft-btn ft-btn--ghost">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                Cambiar contraseña
            </a>
        </div>
    </form>
</div>
</body>
</html>
