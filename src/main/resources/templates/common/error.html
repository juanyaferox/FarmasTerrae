<!DOCTYPE html>
<html th:attr="lang=${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('FarmasTerrae — Error', '/css/layout.css')}"></head>
<body>
<!-- Header -->
<header th:replace="~{fragments/header :: header}"></header>

<main id="main-content" class="ft-auth-shell">
    <div class="ft-container">
        <!-- Atributos reales: errorCode / errorMessageLabel (GlobalExceptionHandler, SecurityConfig) y errorId (request attribute) -->
        <section class="ft-state-card" aria-labelledby="error-title">
            <span class="ft-state-card__icon ft-state-card__icon--danger" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                    <line x1="12" y1="8" x2="12" y2="12.5"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
            </span>

            <span class="ft-eyebrow">Error de solicitud</span>
            <h1 id="error-title" class="er-title ft-tabular"
                th:text="${errorCode != null ? 'Error ' + errorCode : 'Error'}">Error</h1>
            <p class="er-message"
               th:text="${errorMessageLabel != null ? errorMessageLabel : 'Ha ocurrido un error inesperado.'}">
                Ha ocurrido un error inesperado.</p>

            <!-- ID del error: solo si existe -->
            <p class="ft-state-card__code ft-tabular" th:if="${errorId}">
                Código de error: <span th:text="${errorId}">[error-id]</span>
            </p>

            <div class="er-actions">
                <a th:if="${errorCode == 401}" th:href="@{/auth}" class="ft-btn ft-btn--mint">Iniciar sesión</a>
                <a th:href="@{/}" class="ft-btn ft-btn--mint">Volver al inicio</a>
                <a th:href="@{/products/categories}" class="ft-btn ft-btn--ghost">Explorar catálogo</a>
            </div>
        </section>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
