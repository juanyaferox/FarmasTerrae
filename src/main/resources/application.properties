# Shared defaults for every profile. Environment-specific settings live in:
#   application-dev.properties        local H2 development (./mvnw -Pdev spring-boot:run)
#   application-prodminio.properties  local Docker stack with MinIO (docker-compose.help.yml)
#   application-prod.properties       production: MySQL + AWS S3 behind Nginx (docker-compose.yml)
spring.application.name=farmasterrae
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# The H2 console is only enabled by the dev profile (and then restricted to ADMIN users)
spring.h2.console.enabled=false

spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Configuracion para usar camelCase en los nombres de columnas
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
spring.mvc.hiddenmethod.filter.enabled=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# SMTP (Gmail): STARTTLS is mandatory and the server certificate must match the host name
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# S3: the AWS default credentials chain (e.g. an IAM role) is used unless a profile enables static keys
aws.region=us-east-1
aws.s3.bucket-name=farmasterrae
aws.s3.static-credentials=false

# Optional first ADMIN account, created by AdminBootstrapRunner only when all three values are set
# and no ADMIN user exists yet
app.admin-bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin-bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# Liquibase only runs in prod/prodminio, through LiquibaseRunnerConfig (after Hibernate).
# Never send usage analytics to Liquibase from our servers.
spring.liquibase.enabled=false
spring.liquibase.analytics-enabled=false
