# Test overrides. Spring Boot loads classpath:/config/application.properties on top of
# src/main/resources/application.properties (a same-named file in src/test/resources would
# replace it entirely), so tests share the real base settings without activating a profile.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

app.security=test-only-remember-me-key-32-characters-minimum
app.base-url=http://localhost:8080
spring.mail.username=test@farmasterrae.local
spring.mail.password=test-mail-password
aws.s3.static-credentials=true
aws.accessKey=test-access-key
aws.secretKey=test-secret-key

# Ignore any ADMIN_BOOTSTRAP_* variables from the machine running the tests
app.admin-bootstrap.username=
app.admin-bootstrap.email=
app.admin-bootstrap.password=
