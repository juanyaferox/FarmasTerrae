# Production stack: MySQL + Spring Boot (`prod` profile) + Nginx TLS reverse proxy.
# Only Nginx publishes ports (80/443); MySQL and the app are reachable on the internal network only.
# Requires a filled-in `.env` (see .env.example) and TLS files in ./ssl (mounted read-only):
#   ssl/farmasterrae.crt  (certificate + chain)
#   ssl/farmasterrae.key  (private key)

services:

  # 1) Servicio de base de datos MySQL
  db:
    image: mysql:8.0.46
    container_name: mysql_farmasterrae
    restart: always
    environment:
      MYSQL_DATABASE: "${DB_NAME:?Set DB_NAME in .env}"
      MYSQL_USER: "${DB_USERNAME:?Set DB_USERNAME in .env}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      # The image defaults MYSQL_ROOT_HOST to "%" (root reachable from any host); keep root local
      MYSQL_ROOT_HOST: localhost
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      # TCP ping: the temporary server used during first-time initialisation listens on the socket only
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # 2) Servicio de la aplicación Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring_farmasterrae
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Variables del .env (unset ones fall back to the defaults in application-prod.properties)
      - SPRING_PROFILES_ACTIVE
      - SECRET_KEY
      - DB_NAME
      - DB_HOST
      - DB_PORT
      - DB_USERNAME
      - DB_PASSWORD
      - DB_SSL_MODE
      - HIBERNATE_DDL_AUTO
      - EMAIL
      - PASSWORD
      - AWS_REGION
      - AWS_BUCKET
      # Optional one-off creation of the first ADMIN account (see .env.example)
      - ADMIN_BOOTSTRAP_USERNAME
      - ADMIN_BOOTSTRAP_EMAIL
      - ADMIN_BOOTSTRAP_PASSWORD
    networks:
      - backend

  # 3) Proxy inverso Nginx con TLS
  nginx:
    image: nginx:1.30-alpine
    container_name: nginx_farmasterrae
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
    driver: bridge
