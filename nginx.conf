# Nginx TLS reverse proxy for the production stack (docker-compose.yml).
# Certificates are mounted read-only at runtime from ./ssl (never committed):
#   /etc/nginx/ssl/farmasterrae.crt (certificate + chain) and /etc/nginx/ssl/farmasterrae.key

events {
    worker_connections 1024;
}

http {
    # Do not advertise the Nginx version
    server_tokens off;

    # Same limit as Spring's multipart settings (10 MB product images); Nginx defaults to 1 MB
    client_max_body_size 10m;

    # Brute-force protection for credential forms: POSTs to /auth (login) and /auth/*
    # (register, password recovery, password change), per client IP
    map $request_method $auth_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $auth_limit_key zone=auth_limit:10m rate=10r/m;
    limit_req_status 429;

    upstream spring_app {
        server app:8080;
    }

    # Requests for any other host name (or a bare IP address) are dropped
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }

    # Redirigir HTTP a HTTPS
    server {
        listen 80;
        # Replace/extend with your public domain(s), e.g. "farmasterrae.example.com"; keep in sync below
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # Servidor HTTPS
    server {
        listen 443 ssl;
        # Replace/extend with your public domain(s); must match the certificate
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/farmasterrae.crt;
        ssl_certificate_key /etc/nginx/ssl/farmasterrae.key;

        # Mozilla "intermediate" TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;

        # Security headers (Spring Security owns Referrer-Policy, Permissions-Policy, and CSP
        # so per-route overrides like Referrer-Policy: no-referrer on /auth/resetPassword are preserved)
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Only forward values set by Nginx: client-supplied forwarding headers are dropped, and
        # the app trusts X-Forwarded-For/-Proto from this proxy only (Tomcat RemoteIpValve)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";

        location = /auth {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://spring_app;
        }

        location /auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://spring_app;
        }

        location / {
            proxy_pass http://spring_app;
        }
    }
}
